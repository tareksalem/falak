syntax = "proto3";

package falak.sync;

option go_package = "github.com/tareksalem/falak/node/proto/syncpb";

import "google/protobuf/timestamp.proto";

// ============================================================================
// STREAM MESSAGES (Protocol: /falak/sync/1.0)
// ============================================================================

// SyncRequest is sent to request member list synchronization
message SyncRequest {
    string cluster_path = 1;                      // Cluster to sync
    google.protobuf.Timestamp last_sync_time = 2; // nil for full sync, set for delta sync
    string request_id = 3;                        // For correlation
    int32 max_members = 4;                        // Pagination limit (0 = no limit)
    string cursor = 5;                            // For pagination continuation
}

// SyncResponse contains the member list and revocations
message SyncResponse {
    string request_id = 1;                        // Correlation with request
    repeated MemberInfo members = 2;              // Member list
    google.protobuf.Timestamp sync_time = 3;      // Use as last_sync_time next time
    bool is_complete = 4;                         // False if more pages available
    string next_cursor = 5;                       // For pagination continuation
    string error = 6;                             // Error message if sync failed
    repeated RevocationEntry revocations = 7;     // Certificate revocations to merge
}

// SyncPush actively delivers a single newly-admitted member to an existing
// peer (Layer 1 of the O13 join-convergence design). Unlike SyncRequest /
// SyncResponse (pull), this is a push initiated by the voucher's fan-out so
// existing members learn about a new node without waiting for the best-effort
// Step-2 PubSub broadcast or the periodic anti-entropy tail. The receiver
// verifies the sender is an authenticated peer (same phonebook.Exists gate as
// SyncRequest) and inserts the member via the idempotent processMember path.
message SyncPush {
    string cluster_path = 1;                      // Cluster the member belongs to
    MemberInfo member = 2;                        // The newly-admitted member to insert
    string push_id = 3;                           // For correlation / logging
}

// SyncPushAck acknowledges a SyncPush.
message SyncPushAck {
    string push_id = 1;                           // Correlation with the push
    bool accepted = 2;                            // True if the member was inserted/updated
    string error = 3;                             // Non-empty on rejection
}

// RevocationEntry describes a revoked certificate
message RevocationEntry {
    string cert_fingerprint = 1;                  // SHA-256 of the certificate bytes
    string node_id = 2;                           // Node whose cert was revoked
    string cluster_path = 3;                      // Cluster this applies to
    google.protobuf.Timestamp revoked_at = 4;
    string reason = 5;
    string revoked_by = 6;                        // Node that initiated the revocation
}

// ============================================================================
// SHARED TYPES
// ============================================================================

// MemberInfo describes a cluster member (extended version for sync)
message MemberInfo {
    string node_id = 1;
    repeated string addresses = 2;
    bytes public_key = 3;
    Capabilities capabilities = 4;
    google.protobuf.Timestamp joined_at = 5;
    google.protobuf.Timestamp last_seen = 6;
    string status = 7;                            // active, suspected, quarantined, etc.
}

// Capabilities describes a node's resources and features
message Capabilities {
    int32 cpu_cores = 1;
    int64 memory_mb = 2;
    int64 disk_gb = 3;
    string datacenter = 4;
    repeated string tags = 5;
    map<string, string> metadata = 6;
}
